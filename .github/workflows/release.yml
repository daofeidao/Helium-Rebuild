name: Build Helium Release

on:
  push:
    tags:
      - "v*.*.**"

# The token is read-only by default on a freshly created repository, which is
# how the upload step below managed to build a perfectly good tipa and then
# fail with a 403 creating the release for it. Asking for exactly what is
# needed keeps the rest of the token read-only.
permissions:
  contents: write

env:
  THEOS: ''
  XCODE_VERSION: '15.1'
  logT: ''
  # Bumped with every modified release. The gate below insists the strings that
  # end up inside the app carry exactly this tag, in both languages: a settings
  # page that says V1.0 on a V2.0 build is a lie that nothing else catches.
  MOD_TAG_ZH: '修改版V2.0'
  MOD_TAG_EN: 'Mod V2.0'

jobs:
  build:
    # macos-13 is gone: GitHub retired that image, and a job asking for it does
    # not fail, it queues forever with an empty runner_name. That is what the
    # upstream file asks for, and it is why its builds never start.
    #
    # macos-14 is the newest image that still offers Xcode 15.1, which is what
    # XCODE_VERSION pins and what theos needs: the newest theos SDK is
    # iPhoneOS16.5.sdk, whose SwiftUI .swiftinterface was built by Apple Swift
    # 5.8, so a Swift 6 compiler refuses it with
    #   "failed to build module 'SwiftUI'; this SDK is not supported by the compiler"
    # Matching the toolchain to the SDK is the fix; there is no newer theos SDK
    # to move up to.
    runs-on: macos-14

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg ldid make libplist openssl@3
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Restore additional SDKs
        id: cached-sdks-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: ${{ runner.os }}-sdks-${{ env.XCODE_VERSION }}

      - if: ${{ steps.cached-sdks-restore.outputs.cache-hit != 'true' }}
        name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - if: ${{ steps.cached-sdks-restore.outputs.cache-hit != 'true' }}
        name: Save SDKs
        id: cached-sdks-save
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: ${{ steps.cached-sdks-restore.outputs.cache-primary-key }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Helium
          submodules: recursive
  
      - name: Setup build environment
        run: |
          echo "Available SDKs: $(find $THEOS/sdks -name "*.sdk" -maxdepth 1 -print)"
          sT=$(TZ=UTC-8 date +'%S')
          echo "msT=$(date -j -f "%Y-%m-%d %H:%M:%S" "$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" +%s)" >> $GITHUB_ENV
          echo "logT=$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" >> $GITHUB_ENV
          echo $msT
          echo $logT

      - name: Make IPA
        run: |
          cd $GITHUB_WORKSPACE/Helium
          ./ipabuild.sh

      # Fail-closed, and before anything is uploaded. Every check exits 1
      # explicitly so that a gate which dies cannot be read as a gate which
      # passed.
      #
      # The entitlement pair is the part worth having: an .app without
      # platform-application installs as an ordinary app, and one without
      # run-unsigned-code never gets the injected HUD to start. Either way the
      # upload succeeds, the release looks correct, and the phone shows nothing
      # -- exactly the failure that costs an hour to notice.
      #
      # The language check guards the other silent one: a key that reaches only
      # one .strings file shows raw English on a Chinese phone, with no error
      # anywhere.
      - name: Verify artifact
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/Helium
          TIPA=build/Helium.tipa
          [ -s "$TIPA" ] || { echo "FAIL: $TIPA missing or empty"; exit 1; }

          rm -rf .verify && mkdir .verify && cd .verify
          unzip -q "../$TIPA"
          APP=Payload/Helium.app
          [ -d "$APP" ] || { echo "FAIL: $APP missing"; exit 1; }
          BIN=$APP/Helium
          [ -f "$BIN" ] || { echo "FAIL: main binary missing"; exit 1; }

          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $APP/Info.plist)
          [ "$BID" = "com.leemin.helium" ] || { echo "FAIL: bundle id is '$BID'"; exit 1; }

          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist)
          case "$SHORT" in
            ''|*[!0-9.]*) echo "FAIL: CFBundleShortVersionString '$SHORT' is not dot-separated digits"; exit 1 ;;
          esac

          ENT=$(codesign -d --entitlements - "$BIN" 2>/dev/null || true)
          echo "$ENT" | grep -q 'platform-application' \
            || { echo "FAIL: platform-application entitlement missing (would install as an ordinary app)"; exit 1; }
          echo "$ENT" | grep -q 'run-unsigned-code' \
            || { echo "FAIL: run-unsigned-code entitlement missing (the HUD would never run)"; exit 1; }

          ZH=$APP/zh-Hans.lproj/Localizable.strings
          EN=$APP/en.lproj/Localizable.strings
          [ -f "$ZH" ] || { echo "FAIL: $ZH missing"; exit 1; }
          [ -f "$EN" ] || { echo "FAIL: $EN missing"; exit 1; }
          ZH_DUMP=$(plutil -convert xml1 -o - "$ZH")
          EN_DUMP=$(plutil -convert xml1 -o - "$EN")
          echo "$ZH_DUMP" | grep -q "$MOD_TAG_ZH" \
            || { echo "FAIL: zh bundle does not carry the '$MOD_TAG_ZH' tag"; exit 1; }
          echo "$EN_DUMP" | grep -q "$MOD_TAG_EN" \
            || { echo "FAIL: en bundle does not carry the '$MOD_TAG_EN' tag"; exit 1; }
          # The halo's rows, both languages. A key that only reaches one file
          # shows up as raw English on a Chinese phone, with no error anywhere.
          for KEY in 'Text Halo' 'Text Outline' 'Outline Width' 'Outline Color' 'Text Glow' 'Glow Width' 'Glow Color'; do
            echo "$ZH_DUMP" | grep -q "$KEY" \
              || { echo "FAIL: zh bundle is missing the '$KEY' string"; exit 1; }
            echo "$EN_DUMP" | grep -q "$KEY" \
              || { echo "FAIL: en bundle is missing the '$KEY' string"; exit 1; }
          done

          SIZE=$(stat -f%z "../$TIPA")
          [ "$SIZE" -gt 1000000 ] || { echo "FAIL: tipa is only $SIZE bytes"; exit 1; }
          echo "artifact self-check passed: $BID $SHORT, $SIZE bytes"

      - name: Collect symbols
        run: |
          cd $GITHUB_WORKSPACE/Helium
          find .theos/obj -name "*.dSYM" -print | zip -r build/Helium_symbols.zip -@

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Helium.tipa
          path: ${{ github.workspace }}/Helium/build/Helium.tipa

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Helium_symbols
          path: ${{ github.workspace }}/Helium/build/Helium_symbols.zip

      - name: Upload release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: build time ${{ env.logT }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/Helium/build/Helium.tipa